[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4bi"
version = "0.1.0"
description = "AI-for-BI self-service analytics platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyarrow>=12.0",
    "duckdb>=0.9",
    "pandas>=2.0",
    "plotly>=5.0",
    "streamlit>=1.35",
    "xlsxwriter>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
llm = [
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai4bi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
